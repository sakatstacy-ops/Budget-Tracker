<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Budget Tracker</title>

    <!-- Link CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Main Heading -->
    <header>
        <h1 id="main-heading">My Budget Tracker</h1>

        <p class="subtitle">
            Track your income and expenses in one place.
        </p>
    </header>

    <!-- Add Expense Section -->
    <section class="expense-section">

        <h2>Add Expense</h2>

        <input
            type="text"
            placeholder="Expense Name">

        <input
            type="number"
            placeholder="Amount">

        <input
            type="text"
            placeholder="Category">

    </section>

    <!-- Expense List Placeholder -->
    <section class="expenses">

        <h2>Your Expenses</h2>

        <p>No expenses yet.</p>

    </section>

</body>
</html>
